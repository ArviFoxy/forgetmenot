[package]
name = "forgetmenot-server"
description = "forgetmenot: trigger-based, scoped LLM memory server (hooks, MCP, JSON API)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "forgetmenot"
path = "src/main.rs"

[lib]
name = "forgetmenot_server"
path = "src/lib.rs"

[dependencies]
forgetmenot-types.workspace = true
serde.workspace = true
serde_json.workspace = true
yaml_serde.workspace = true
tokio.workspace = true
tokio-util.workspace = true
axum.workspace = true
tower-http.workspace = true
rmcp.workspace = true
regex.workspace = true
git2.workspace = true
rusqlite.workspace = true
rusqlite_migration.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
ureq.workspace = true
rmcp = { version = "3.3", features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
