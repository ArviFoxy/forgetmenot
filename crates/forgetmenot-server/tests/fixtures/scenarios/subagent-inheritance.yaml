name: subagent-inheritance
reasoning: >
  Detects a subagent that starts with only the implicit scopes, a subagent that
  shares its parent's delivery record, and a parent affected by what its children
  were told. The first would hide from the subagent the memories of the work it
  was spawned for; the second would let it act on a critical rule it was never
  shown; the third would stop the parent's calls for deliveries that went
  somewhere else.

  Steps 0 and 1 put the session into widgets, and therefore rocketry, and give it
  all five memories due to it.

  Step 2, the subagent start: the child context agent-7 is created with a copy of
  the parent's active scopes, so everything due to the parent is due to it, and
  nothing has been delivered into it. It gets both critical memories in full and
  all three knowledge memories as index lines. A subagent start cannot stop
  anything, so the decision is context. Were the child to start from the implicit
  scopes alone, widget-naming and rocket-stages would be missing.

  Step 3, the subagent's own tool call: everything was delivered at its start, so
  the call goes ahead with nothing attached.

  Step 4 is the first event of a second subagent, agent-8, whose start was not
  seen: the context is created on the spot, again from the parent's scopes, so
  both critical memories are new and this PreToolUse is stopped once and carries
  them.

  Step 5, back in the session: the parent holds everything already, and neither
  child's delivery belongs to it, so its call goes ahead with nothing attached.
steps:
  - hook:
      machine: alpha
      context_tokens: 40000
      event:
        hook_event_name: SessionStart
        session_id: session-1
        cwd: /home/dev/widgets
        permission_mode: default
        source: startup
    expect:
      decision: context
      full: [bench-power]
      index: [reading-list, sessions/alpha/session-1/notes]

  - hook:
      machine: alpha
      context_tokens: 40000
      event:
        hook_event_name: UserPromptSubmit
        session_id: session-1
        cwd: /home/dev/widgets
        permission_mode: default
        prompt: rename the widget brackets
    expect:
      decision: context
      full: [widget-naming]
      index: [rocket-stages]

  - hook:
      machine: alpha
      context_tokens: 40000
      event:
        hook_event_name: SubagentStart
        session_id: session-1
        cwd: /home/dev/widgets
        permission_mode: default
        agent_id: agent-7
        agent_type: general-purpose
        task_description: Survey the crate and list its public functions
    expect:
      decision: context
      full: [bench-power, widget-naming]
      index: [reading-list, rocket-stages, sessions/alpha/session-1/notes]

  - hook:
      machine: alpha
      context_tokens: 40000
      event:
        hook_event_name: PreToolUse
        session_id: session-1
        cwd: /home/dev/notes
        permission_mode: default
        agent_id: agent-7
        agent_type: general-purpose
        tool_name: Grep
        tool_use_id: toolu_01DDDDDDDDDDDDDDDDDDDDDD
        tool_input:
          pattern: pub fn
          path: /home/dev/notes
    expect:
      decision: none

  - hook:
      machine: alpha
      context_tokens: 40000
      event:
        hook_event_name: PreToolUse
        session_id: session-1
        cwd: /home/dev/notes
        permission_mode: default
        agent_id: agent-8
        agent_type: general-purpose
        tool_name: Grep
        tool_use_id: toolu_01EEEEEEEEEEEEEEEEEEEEEE
        tool_input:
          pattern: pub fn
          path: /home/dev/notes
    expect:
      decision: deny
      full: [bench-power, widget-naming]
      index: [reading-list, rocket-stages, sessions/alpha/session-1/notes]

  - hook:
      machine: alpha
      context_tokens: 40000
      event:
        hook_event_name: PreToolUse
        session_id: session-1
        cwd: /home/dev/notes
        permission_mode: default
        tool_name: Read
        tool_use_id: toolu_01BBBBBBBBBBBBBBBBBBBBBB
        tool_input:
          file_path: /home/dev/notes/README.md
    expect:
      decision: none
