name: compaction-redelivery
reasoning: >
  Detects a compaction that leaves the delivery record standing, and one that
  also clears the scopes: after a compaction nothing delivered before it is in
  the context any more, so everything due has to arrive again, but the session is
  still working in the same scopes and must not lose them.

  Step 0, the session start: bench-power in full, reading-list and the session's
  notes as index lines.

  Step 1, a prompt naming a widget: the user_message trigger of widgets fires and
  widgets implies rocketry, so widget-naming arrives in full and rocket-stages as
  an index line. A prompt cannot stop anything, so the decision is context.

  Step 2, the compaction itself: Claude Code is rebuilding the context at that
  moment, so nothing is delivered and the answer asks for nothing. It empties the
  delivery record and leaves the scopes alone.

  Step 3, the next prompt, which matches no trigger: the scopes are still global,
  machine:alpha, session:alpha/session-1, widgets and rocketry, and nothing at
  all counts as delivered, so both critical memories arrive in full again and all
  three knowledge memories as index lines. Nothing is withdrawn: the delivery
  record was emptied, not the store.
steps:
  - hook:
      machine: alpha
      context_tokens: 40000
      event:
        hook_event_name: SessionStart
        session_id: session-1
        cwd: /home/dev/widgets
        permission_mode: default
        source: startup
    expect:
      decision: context
      full: [bench-power]
      index: [reading-list, sessions/alpha/session-1/notes]

  - hook:
      machine: alpha
      context_tokens: 60000
      event:
        hook_event_name: UserPromptSubmit
        session_id: session-1
        cwd: /home/dev/widgets
        permission_mode: default
        prompt: rename the widget brackets
    expect:
      decision: context
      full: [widget-naming]
      index: [rocket-stages]

  - hook:
      machine: alpha
      context_tokens: 20000
      event:
        hook_event_name: PostCompact
        session_id: session-1
        cwd: /home/dev/widgets
        permission_mode: default
        trigger: auto
        tokens_removed: 150000
    expect:
      decision: none

  - hook:
      machine: alpha
      context_tokens: 20000
      event:
        hook_event_name: UserPromptSubmit
        session_id: session-1
        cwd: /home/dev/widgets
        permission_mode: default
        prompt: carry on where we left off
    expect:
      decision: context
      full: [bench-power, widget-naming]
      index: [reading-list, rocket-stages, sessions/alpha/session-1/notes]
