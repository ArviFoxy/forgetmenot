name: interrupt-then-reissue
reasoning: >
  Detects a deny loop and a deny that carries nothing: the session could not
  make progress, or would be stopped with no rule to read.

  Step 0, a session start on alpha/session-1: the context starts in global,
  machine:alpha and session:alpha/session-1, so Due is bench-power (global,
  critical, in full), reading-list (global, knowledge, index line) and the
  session's own notes (knowledge, index line). Nothing was delivered before, so
  all three are new; a session start cannot stop a call, so the decision is
  context. No trigger fires: the only working_directory trigger is the workshop
  one and /home/dev/widgets does not match it, so all three scopes of the store
  are offered as ones the session can turn on.

  Step 1, a tool call whose input names widgets: the tool_input trigger of the
  widgets scope fires and widgets implies rocketry, so widget-naming (critical)
  and rocket-stages (knowledge) are new. A new critical memory at a PreToolUse
  stops the call, and the stopped call carries what is new; bench-power,
  reading-list and the notes were delivered at step 0 and are not sent again.

  Step 2, the same call issued again: the interrupt rule marks what it carried as
  delivered, so nothing is new, changed or stale and the call must go ahead with
  nothing attached.
steps:
  - hook:
      machine: alpha
      context_tokens: 40000
      event:
        hook_event_name: SessionStart
        session_id: session-1
        cwd: /home/dev/widgets
        permission_mode: default
        source: startup
    expect:
      decision: context
      full: [bench-power]
      index: [reading-list, sessions/alpha/session-1/notes]
      available: [rocketry, widgets, workshop]

  - hook:
      machine: alpha
      context_tokens: 40000
      event:
        hook_event_name: PreToolUse
        session_id: session-1
        cwd: /home/dev/widgets
        permission_mode: default
        tool_name: Bash
        tool_use_id: toolu_01AAAAAAAAAAAAAAAAAAAAAA
        tool_input:
          command: cargo test -p widgets
          description: Run the widgets test suite
    expect:
      decision: deny
      full: [widget-naming]
      index: [rocket-stages]

  - hook:
      machine: alpha
      context_tokens: 40000
      event:
        hook_event_name: PreToolUse
        session_id: session-1
        cwd: /home/dev/widgets
        permission_mode: default
        tool_name: Bash
        tool_use_id: toolu_01AAAAAAAAAAAAAAAAAAAAAA
        tool_input:
          command: cargo test -p widgets
          description: Run the widgets test suite
    expect:
      decision: none
