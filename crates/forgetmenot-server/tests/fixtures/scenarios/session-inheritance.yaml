name: session-inheritance
reasoning: >
  Detects inheritance that copies the other session's scopes without its own
  session scope: the reason one session takes over another is to read the notes
  that session wrote, and those live in its session scope alone, which no trigger
  can ever turn on.

  Step 0, the first session start: alpha/session-1 is in its own session scope, so
  it is owed its notes as an index line.

  Step 1, the second session start: alpha/session-2 is in global, machine:alpha
  and session:alpha/session-2, so it is owed bench-power and reading-list and must
  not be owed the notes of the other session.

  Step 2 is the inherit call, which changes the calling context's scopes and
  nothing in the store. Its effect is not delivered until the next event on that
  context.

  Step 3, the next event on alpha/session-2: session:alpha/session-1 is now one
  of its scopes, so the notes are due and new. They are a knowledge memory, so
  they arrive as an index line and a knowledge arrival never stops a call.
  bench-power and reading-list were delivered at step 1 and are unchanged.
steps:
  - hook:
      machine: alpha
      context_tokens: 40000
      event:
        hook_event_name: SessionStart
        session_id: session-1
        cwd: /home/dev/widgets
        permission_mode: default
        source: startup
    expect:
      decision: context
      full: [bench-power]
      index: [reading-list, sessions/alpha/session-1/notes]

  - hook:
      machine: alpha
      context_tokens: 40000
      event:
        hook_event_name: SessionStart
        session_id: session-2
        cwd: /home/dev/widgets
        permission_mode: default
        source: startup
    expect:
      decision: context
      full: [bench-power]
      index: [reading-list]

  - operation:
      name: session_inherit
      session_key: alpha/session-2
      from: alpha/session-1

  - hook:
      machine: alpha
      context_tokens: 40000
      event:
        hook_event_name: PreToolUse
        session_id: session-2
        cwd: /home/dev/notes
        permission_mode: default
        tool_name: Read
        tool_use_id: toolu_01BBBBBBBBBBBBBBBBBBBBBB
        tool_input:
          file_path: /home/dev/notes/README.md
    expect:
      decision: context
      index: [sessions/alpha/session-1/notes]
