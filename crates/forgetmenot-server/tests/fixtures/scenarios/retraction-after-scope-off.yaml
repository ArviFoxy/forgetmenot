name: retraction-after-scope-off
reasoning: >
  Detects a scope that cannot be turned off, a withdrawal reported as a
  deletion, and an implied scope turned off with the scope that implied it. The
  first two would leave the model acting on a rule it was told to stop working
  under, or tell it a rule was taken out of the store when it was not. The third
  would silently withdraw memories nobody asked to stop working with: a scope is
  a flag, and the state does not record which trigger or implication set it.

  Step 0 is the session start. Step 1 turns the widgets scope on through the
  session tool rather than a trigger, and its implied closure turns rocketry on
  with it.

  Step 2, the next tool call: widget-naming is new and critical, so the call is
  stopped and carries it, together with rocket-stages as an index line.

  Step 3 turns widgets off again, and only widgets: rocketry stays on.

  Step 4, the next event: no active scope covers widget-naming any more, so it is
  withdrawn, with `scope off` as the reason, because the memory is still in the
  store and in force everywhere else. rocket-stages is still due and still
  delivered, so it is neither sent again nor withdrawn.
steps:
  - hook:
      machine: alpha
      context_tokens: 40000
      event:
        hook_event_name: SessionStart
        session_id: session-1
        cwd: /home/dev/notes
        permission_mode: default
        source: startup
    expect:
      decision: context
      full: [bench-power]
      index: [reading-list, sessions/alpha/session-1/notes]

  - operation:
      name: session_scope_on
      session_key: alpha/session-1
      scope: widgets

  - hook:
      machine: alpha
      context_tokens: 40000
      event:
        hook_event_name: PreToolUse
        session_id: session-1
        cwd: /home/dev/notes
        permission_mode: default
        tool_name: Read
        tool_use_id: toolu_01BBBBBBBBBBBBBBBBBBBBBB
        tool_input:
          file_path: /home/dev/notes/README.md
    expect:
      decision: deny
      full: [widget-naming]
      index: [rocket-stages]

  - operation:
      name: session_scope_off
      session_key: alpha/session-1
      scope: widgets

  - hook:
      machine: alpha
      context_tokens: 40000
      event:
        hook_event_name: Stop
        session_id: session-1
        cwd: /home/dev/notes
        permission_mode: default
        last_assistant_message: That is the bracket work finished.
    expect:
      decision: context
      retracted:
        - id: widget-naming
          reason: scope off
