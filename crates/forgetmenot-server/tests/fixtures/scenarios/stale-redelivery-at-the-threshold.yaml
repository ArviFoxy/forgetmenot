name: stale-redelivery-at-the-threshold
reasoning: >
  Detects a stale threshold off by one in either direction, staleness judged
  against the wrong context size, and a stale delivery that stops the call. A
  threshold that fires early wastes the context it is trying to protect; one that
  fires late leaves a critical rule out of the model's reach; a stale delivery
  that stops a call would interrupt a session at a fixed interval for a rule
  nothing changed about.

  This scenario runs with K = 1000 and reports context sizes by hand, which is
  what the client reads from the transcript.

  Step 0, the session start at 40000 tokens: bench-power in full and the two
  knowledge memories as index lines, all recorded as delivered at 40000.

  Step 1, a tool call at 40999, one token short of K: 40999 − 40000 < 1000, so
  nothing is stale and nothing at all is owed.

  Step 2, a tool call at 41000, exactly K on from the delivery: everything shown
  at step 0 is K tokens of context behind and out of the model's reach, so all of
  it is delivered again, each in the form its kind gets: bench-power in full, the
  two knowledge memories as their index lines. Staleness is not an arrival:
  nothing is new or changed, so the call is not stopped.
reminder_tokens: 1000
steps:
  - hook:
      machine: alpha
      context_tokens: 40000
      event:
        hook_event_name: SessionStart
        session_id: session-1
        cwd: /home/dev/notes
        permission_mode: default
        source: startup
    expect:
      decision: context
      full: [bench-power]
      index: [reading-list, sessions/alpha/session-1/notes]

  - hook:
      machine: alpha
      context_tokens: 40999
      event:
        hook_event_name: PreToolUse
        session_id: session-1
        cwd: /home/dev/notes
        permission_mode: default
        tool_name: Read
        tool_use_id: toolu_01BBBBBBBBBBBBBBBBBBBBBB
        tool_input:
          file_path: /home/dev/notes/README.md
    expect:
      decision: none

  - hook:
      machine: alpha
      context_tokens: 41000
      event:
        hook_event_name: PreToolUse
        session_id: session-1
        cwd: /home/dev/notes
        permission_mode: default
        tool_name: Read
        tool_use_id: toolu_01CCCCCCCCCCCCCCCCCCCCCC
        tool_input:
          file_path: /home/dev/notes/README.md
    expect:
      decision: context
      full: [bench-power]
      index: [reading-list, sessions/alpha/session-1/notes]
