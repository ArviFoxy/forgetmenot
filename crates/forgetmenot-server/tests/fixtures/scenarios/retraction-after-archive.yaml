name: retraction-after-archive
reasoning: >
  Detects an archived memory that goes on being delivered, and one that is
  dropped silently: a session that was given a rule in full has to be told the
  rule is retired, because nothing else in its context says so.

  Steps 0 and 1 put the session into widgets and give it widget-naming in full
  and rocket-stages as an index line.

  Step 2 archives widget-naming. Archiving is a write to the store like any
  other, so it changes nothing in the session until its next event.

  Step 3, the next event: widget-naming is no longer due because it is archived,
  and it is in the delivery record, so it is withdrawn, with `archived` as the
  reason, which tells the rule apart from one the session merely stopped working
  under. Its body must not arrive again. rocket-stages is untouched: archiving one
  memory says nothing about any other.
steps:
  - hook:
      machine: alpha
      context_tokens: 40000
      event:
        hook_event_name: SessionStart
        session_id: session-1
        cwd: /home/dev/widgets
        permission_mode: default
        source: startup
    expect:
      decision: context
      full: [bench-power]
      index: [reading-list, sessions/alpha/session-1/notes]

  - hook:
      machine: alpha
      context_tokens: 40000
      event:
        hook_event_name: UserPromptSubmit
        session_id: session-1
        cwd: /home/dev/widgets
        permission_mode: default
        prompt: rename the widget brackets
    expect:
      decision: context
      full: [widget-naming]
      index: [rocket-stages]

  - commit:
      memory: widget-naming
      archive: true

  - hook:
      machine: alpha
      context_tokens: 40000
      event:
        hook_event_name: Stop
        session_id: session-1
        cwd: /home/dev/widgets
        permission_mode: default
        last_assistant_message: The brackets are renamed and the build is green.
    expect:
      decision: context
      retracted:
        - id: widget-naming
          reason: archived
