<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>forgetmenot</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/logo-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/logo-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <script>
      // The colour scheme, applied before the first paint. The key is the one
      // src/theme.ts writes and the class is Shoelace's dark theme.
      try {
        var stored = localStorage.getItem('fmn-colour-scheme');
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('sl-theme-dark');
      } catch (ignored) {
        /* storage is unavailable, so the light theme is used */
      }
    </script>
  </head>
  <body>
    <fmn-app></fmn-app>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
