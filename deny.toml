[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
version = 2
ignore = [
    # No release of chrono fixes this: the advisory is that the crate has no
    # maintainer. rmcp and schemars depend on chrono as well as the server, so
    # it stays in the dependency tree until they have moved off it too.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; rmcp and schemars still depend on it" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
